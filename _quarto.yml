project:
  type: book

book:
  title: "From FASTQ to Nextflow"
  subtitle: "Reproducible bioinformatics for complete beginners"
  author: "Chathura J. Gunasekara"
  date: last-modified
  repo-url: https://github.com/cjgunase/nextflow-for-biologists
  repo-actions: [edit, issue]
  site-url: https://cjgunase.github.io/nextflow-for-biologists/
  chapters:
    - index.qmd
    - preface.qmd
    - part: "Part I — Build the mental model"
      chapters:
        - chapters/01-the-whole-shebang.qmd
        - chapters/02-terminal-files-paths.qmd
        - chapters/03-workstation-setup.qmd
        - chapters/04-hpc-mental-model.qmd
        - chapters/05-cloud-execution-mental-model.qmd
    - part: "Part II — Git, GitHub and collaborative engineering"
      chapters:
        - chapters/06-git-mental-model.qmd
        - chapters/07-safe-daily-git-workflow.qmd
        - chapters/08-github-collaboration.qmd
        - chapters/09-versions-tags-releases.qmd
    - part: "Part III — Environments, data and a trusted analytical baseline"
      chapters:
        - chapters/10-conda-and-channels.qmd
        - chapters/11-build-tool-environment.qmd
        - chapters/12-test-data-provenance.qmd
        - chapters/06-manual-pipeline.qmd
    - part: "Part IV — Scripting, configuration, logging and tests"
      chapters:
        - chapters/07-strict-bash.qmd
        - chapters/15-defensive-scripts.qmd
        - chapters/16-software-testing.qmd
    - part: "Part V — Containerization and portable software"
      chapters:
        - chapters/08-container-mental-model.qmd
        - chapters/09-build-the-image.qmd
        - chapters/19-registries-image-ci.qmd
        - chapters/10-singularity-on-hpc.qmd
    - part: "Part VI — Nextflow DSL2 from first process to complete pipeline"
      chapters:
        - chapters/11-nextflow-mental-model.qmd
        - chapters/12-first-nextflow-process.qmd
        - chapters/23-channels-tuples-paired-files.qmd
        - chapters/13-complete-dsl2-workflow.qmd
        - chapters/14-profiles-and-runtimes.qmd
        - chapters/16-testing-and-resume.qmd
    - part: "Part VII — Schedulers, CI/CD and reproducible delivery"
      chapters:
        - chapters/15-slurm-execution.qmd
        - chapters/28-cicd-github-actions.qmd
        - chapters/17-reproducibility.qmd
        - chapters/18-release-and-evidence.qmd
    - part: "Part VIII — Working safely and effectively in industry"
      chapters:
        - chapters/31-security-privacy-regulated-boundaries.qmd
        - chapters/32-team-practices-operations.qmd
        - chapters/33-where-to-go-next.qmd
    - part: "Appendices"
      chapters:
        - appendices/glossary.qmd
        - appendices/troubleshooting.qmd
        - appendices/command-reference.qmd
        - appendices/next-steps.qmd
  page-footer:
    left: "From FASTQ to Nextflow"
    right: "A reproducible learning resource"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    link-external-newwindow: true
    number-sections: true
    callout-appearance: simple

execute:
  freeze: auto
