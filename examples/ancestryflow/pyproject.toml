[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ancestryflow"
version = "0.1.0"
description = "Reusable tools for reference-based genetic ancestry analysis"
requires-python = ">=3.11"
dependencies = [
    "pysam==0.24.1",
]
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
ancestryflow = "ancestryflow.cli:main"
